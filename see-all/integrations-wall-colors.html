<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Integrations Wall Colors</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Review tool, not part of the site (2026-11-12). Recreates the Integrations
   wall as Flowout built it on textline-rebrand.webflow.io/integrations at a
   1502px window: 14 x 7 keys, 80px, 2px gap, 8px corners, panel 8 x 5 keys.
   Empty keys take the color of the nearest logo, same rule as Flowout's build. */
:root{--dark:#151515;--lime:#c8ff00}
*{box-sizing:border-box}
body{margin:0;background:var(--dark);color:#fff;font-family:Lexend,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:#0d0d0d;border-bottom:1px solid rgba(255,255,255,.12);
  font:500 11px/1.2 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.6)}
.bar__title{margin-right:auto}
.bar select,.bar button{font:500 13px/1 Lexend,Arial,sans-serif;text-transform:none;letter-spacing:0;color:#fff;background:#151515;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 12px;cursor:pointer}
.bar button:hover,.bar select:hover{border-color:var(--lime);color:var(--lime)}
.bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.bar input{accent-color:var(--lime)}
.wrap{display:flex;gap:24px;align-items:flex-start;padding:32px 16px;justify-content:center;flex-wrap:wrap}
.stage{overflow-x:auto;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(14,80px);grid-auto-rows:80px;gap:2px}
.k{position:relative;border-radius:8px;background:rgba(255,255,255,.04);overflow:hidden;cursor:pointer}
.k.has{background:rgba(255,255,255,.12)}
.k__lit{position:absolute;inset:0;opacity:0;transition:opacity 1000ms linear}
.k:hover .k__lit{opacity:1;transition:none}
.all .k__lit{opacity:1}
.k img{position:absolute;inset:0;margin:auto;width:35px;height:35px;object-fit:contain;z-index:1;pointer-events:none}
.k.sel{outline:2px solid var(--lime);outline-offset:-2px}
.k.drop:hover{outline:2px dashed var(--lime);outline-offset:-2px}
.panel{grid-row:2/span 5;grid-column:4/span 8;border:1px solid rgba(255,255,255,.3);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 48px;text-align:center}
.panel h2{margin:0;font-weight:500;font-size:36px;line-height:1.25;max-width:460px}
.panel p{margin:0;font-size:16px;line-height:1.5;color:rgba(255,255,255,.6);max-width:420px}
.side{width:280px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.side h3{margin:0 0 6px;font:500 11px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.5)}
.row{display:grid;grid-template-columns:28px 1fr 34px;align-items:center;gap:8px}
.sw{width:28px;height:28px;border-radius:6px}
.row input[type=color]{width:34px;height:26px;padding:0;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:none;cursor:pointer}
.row small{color:rgba(255,255,255,.45)}
.hint{color:rgba(255,255,255,.55);font-size:12px;line-height:1.45;margin:8px 0 0}
textarea{width:100%;height:160px;margin-top:8px;font:11px/1.4 "JetBrains Mono",monospace;color:#eee;background:#0d0d0d;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px}
</style></head>
<body>
<div class="bar">
  <span class="bar__title">Integrations wall · color and placement review</span>
  <select id="preset"><option value="grouped">Grouped by color</option><option value="flowout">Flowout as built</option><option value="suggested">Spread out (no matching neighbors)</option></select>
  <select id="blend"><option value="smooth">Blend: smooth fade</option><option value="soft">Blend: soft steps</option><option value="none">Blend: none (Flowout)</option></select>
  <label><input type="checkbox" id="all" checked> All lit</label>
  <button id="reset">Reset to preset</button>
  <button id="copy">Copy settings</button>
</div>
<div class="wrap">
  <div class="stage"><div class="grid all" id="grid"></div></div>
  <div class="side">
    <h3>Logo colors</h3>
    <div id="list"></div>
    <p class="hint">Click a logo key, then click any other key to swap or move it. Turn off All lit to try the hover trail. Gradient tiles show a solid color once you edit them.</p>
    <textarea id="out" readonly hidden></textarea>
  </div>
</div>

    var lab = document.createElement("div"); lab.innerHTML = n + " <small>" + (state.colors[n].bg.charAt(0) === "#" ? state.colors[n].bg.toUpperCase() : "gradient") + "</small>";
    var inp = document.createElement("input"); inp.type = "color"; inp.value = solidOf(n).toLowerCase();
    inp.oninput = function () { state.colors[n] = { bg: inp.value }; render(); };
    row.appendChild(sw); row.appendChild(lab); row.appendChild(inp); list.appendChild(row);
  });
}
function click(r, c, n) {
  if (!sel) { if (n) { sel = n; render(); } return; }
  if (n === sel) { sel = null; render(); return; }
  var from = state.pos[sel].slice();
  if (n) state.pos[n] = from;
  state.pos[sel] = [r, c]; sel = null; render();
}
document.getElementById("preset").onchange = function (e) { load(e.target.value); };
document.getElementById("blend").onchange = function () { render(); };
document.getElementById("reset").onclick = function () { load(document.getElementById("preset").value); };
document.getElementById("all").onchange = function (e) { document.getElementById("grid").classList.toggle("all", e.target.checked); };
document.getElementById("copy").onclick = function () {
  var lines = order.map(function (n) { var p = state.pos[n]; return n + ": row " + p[0] + ", column " + p[1] + ", " + (state.colors[n].bg.charAt(0) === "#" ? state.colors[n].bg.toUpperCase() : "gradient (as built)"); });
  var txt = "Integrations wall, 14 columns x 7 rows, blend: " + document.getElementById("blend").value + "\n" + lines.join("\n");
  var o = document.getElementById("out"); o.hidden = false; o.value = txt; o.select();
  try { navigator.clipboard.writeText(txt); } catch (e) {}
};
load("grouped");
</script>
